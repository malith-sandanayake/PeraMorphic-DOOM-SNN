# SNN Fine-tuning Configuration
# For converting and fine-tuning the SNN from ANN baseline

# Conversion
checkpoint: models/ann_simple
snn_tau: 16.0
snn_leak: 1.0
surrogate_alpha: 1.0
simulation_steps: 16  # T: number of timesteps per environment step

# Training
learning_rate: 1.0e-4
total_timesteps: 2000000
batch_size: 32
n_epochs: 10
gamma: 0.99
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5

# SNN-specific
min_firing_rate: 0.01
max_firing_rate: 0.5  # Sparsity regularization
spike_penalty: 0.001
