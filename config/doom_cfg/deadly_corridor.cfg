# ViZDoom Deadly Corridor Scenario Configuration
# Navigate through a corridor killing enemies

map=/doom2.wad

# Resolution
videoFormat=RGB24
resizeMethod=RESIZE_METHOD_TYPE.ADAPTIVE
screenResolution=SCREEN_RESOLUTION.RES_64X48

# Episode info
episodeStartTime=10
deathPenalty=100

# Rendering options
renderHUD=true
renderMAP=false
renderDECORATE=false
renderCAMERA=false
fontScaleHUD=0.5

# Available buttons
availableButtons=
  - MOVE_FORWARD
  - MOVE_BACKWARD
  - STRAFE_LEFT
  - STRAFE_RIGHT
  - TURN_LEFT
  - TURN_RIGHT
  - ATTACK

# Available game variables
availableGameVariables=
  - HEALTH
  - ARMOR
  - SELECTED_WEAPON
  - SELECTED_WEAPON_AMMO
  - KILLS
  - DEATHS
  - FRAGS

# Rewards
deathPenalty=100
enemyKilledReward=10
enemyDeadReward=5
damageTakenPenalty=1

# Time limit
episodeTimeLimit=1050
