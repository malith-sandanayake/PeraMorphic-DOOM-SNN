# ViZDoom Simple Scenario Configuration
# Learn basic movement and shooting

# Path to WAD file containing the map
map=/doom2.wad

# Path to configuration file with all settings
use=Simple

# Resolution
videoFormat=RGB24
resizeMethod=RESIZE_METHOD_TYPE.ADAPTIVE
screenResolution=SCREEN_RESOLUTION.RES_64X48

# Episode info
episodeStartTime=10
deathPenalty=100

# Rendering options
renderHUD=true
renderMAP=false
renderDECORATE=false
renderCAMERA=false
fontScaleHUD=0.5

# Available buttons
availableButtons=
  - MOVE_FORWARD
  - MOVE_BACKWARD
  - STRAFE_LEFT
  - STRAFE_RIGHT
  - TURN_LEFT
  - TURN_RIGHT
  - ATTACK

# Available game variables
availableGameVariables=
  - HEALTH
  - ARMOR
  - SELECTED_WEAPON
  - SELECTED_WEAPON_AMMO
  - KILLS
  - DEATHS
  - FRAGS
  - SECRETS
  - REPEATS
  - ITEMS
  - SEGMENT
  - SEGMENT_LEFT
  - SEGMENT_RIGHT
  - SEGMENT_LEFT_DOOR
  - SEGMENT_RIGHT_DOOR
  - SEGMENT_LEFT_DOOR_OPEN
  - SEGMENT_RIGHT_DOOR_OPEN
  - SEGMENT_LEFT_DOOR_CLOSE
  - SEGMENT_RIGHT_DOOR_CLOSE
  - SEGMENT_LEFT_DOOR_HALF_CLOSE
  - SEGMENT_RIGHT_DOOR_HALF_CLOSE

# Available indicators
availableIndicators=
  - HEALTH
  - ARMOR
  - SELECTED_WEAPON
  - SELECTED_WEAPON_AMMO
  - KILLS

# Rewards
deathPenalty=100
enemyKilledReward=10
enemyDeadReward=5
damageTakenPenalty=1

# Time limit
episodeTimeLimit=2100
